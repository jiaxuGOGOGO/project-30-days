name: Engineering and U02-A authorization baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-baseline:
    name: Migrations, HTTP authorization, WS lockdown and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=2048
      DATABASE_URL: postgresql://postgres:ci_local_only@127.0.0.1:5432/project30_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:ci_local_only@127.0.0.1:5432/project30_test_e2e
      REDIS_URL: redis://127.0.0.1:6379/1
      E2E_REDIS_URL: redis://127.0.0.1:6379/1
      BASELINE_FRESH_DATABASE_URL: postgresql://postgres:ci_local_only@127.0.0.1:5432/project30_test_fresh
      BASELINE_UPGRADE_DATABASE_URL: postgresql://postgres:ci_local_only@127.0.0.1:5432/project30_test_upgrade
      BASELINE_HISTORICAL_DATABASE_URL: postgresql://postgres:ci_local_only@127.0.0.1:5432/project30_test_historical
      BASELINE_API_URL: http://127.0.0.1:3000
      HOST: 127.0.0.1
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - name: Install frozen dependencies (including build tools)
        run: pnpm install --frozen-lockfile --prod=false
      - name: Validate schemas, types and model specification
        run: |
          pnpm prisma:validate
          pnpm prisma:generate
          pnpm typecheck
          pnpm test:typecheck
          pnpm frontend:typecheck
          pnpm test:model
          node --check test/baseline.spec.cjs
          node --check test/upgrade-stress.cjs
      - name: Create isolated migration and application databases
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient({ datasources: { db: { url: 'postgresql://postgres:ci_local_only@127.0.0.1:5432/postgres' } } });
          (async () => {
            try {
              for (const name of ['project30_test_fresh', 'project30_test_upgrade', 'project30_test_historical', 'project30_test_e2e']) {
                await p.$executeRawUnsafe(`CREATE DATABASE ${name}`);
              }
            } finally { await p.$disconnect(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          pnpm prisma:deploy
          pnpm build
      - name: Start actual compiled Nest application
        run: |
          mkdir -p node_modules/.cache/ci
          node dist/src/main.js > node_modules/.cache/ci/api.log 2>&1 &
          echo $! > node_modules/.cache/ci/api.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASELINE_API_URL/season/active" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat node_modules/.cache/ci/api.log; exit 1; fi
      - name: Real migration histories and HTTP/WS authorization
        run: node --test test/baseline.spec.cjs | tee node_modules/.cache/ci/baseline.log
      - name: Legacy PostgreSQL and Redis integration scenarios
        run: pnpm test:e2e | tee node_modules/.cache/ci/legacy-integration.log
      - name: Build both frontend targets without overwriting artifacts
        env:
          NODE_ENV: production
        run: |
          pnpm frontend:build:h5
          pnpm frontend:build:weapp
          test -s frontend/dist/h5/index.html
          test -s frontend/dist/weapp/app.json
      - name: Stop test application
        if: always()
        run: |
          if [ -f node_modules/.cache/ci/api.pid ]; then
            kill -TERM "$(cat node_modules/.cache/ci/api.pid)" 2>/dev/null || true
          fi
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-auth-baseline-evidence
          path: |
            node_modules/.cache/ci/*.log
            frontend/dist/h5/
            frontend/dist/weapp/
          retention-days: 7
